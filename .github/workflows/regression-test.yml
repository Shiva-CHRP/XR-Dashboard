name: CHRP Simulation Platform - Test Automation Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Headless Regression Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Regression Suite via Maven
      run: mvn clean test -Dheadless=true

    - name: Archive ExtentReports Dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ExtentReports-Artifact
        path: |
          reports/
          target/surefire-reports/
        retention-days: 14
