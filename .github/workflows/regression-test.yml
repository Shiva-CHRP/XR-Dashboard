name: CHRP Simulation Platform - Deployment Sanity Test Automation

on:
  # 1. Trigger automatically when code is pushed to environment branches
  push:
    branches: [ main, master, staging, stage ]
  pull_request:
    branches: [ main, master, staging, stage ]

  # 2. Trigger manually with an environment selector dropdown in GitHub Actions
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target Environment'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      target_url:
        description: 'Custom Application URL (optional override)'
        required: false
        default: ''
        type: string

  # 3. Trigger via external CD deployment pipeline webhooks (e.g., Jenkins, AWS, ArgoCD)
  repository_dispatch:
    types: [ deploy_stage, deploy_prod, post_deployment_sanity ]

jobs:
  deployment-sanity:
    name: Sanity Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Determine Target Environment & URL
      id: env_config
      run: |
        # 1. Check if manually dispatched via workflow_dispatch
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TARGET_ENV="${{ github.event.inputs.environment }}"
          CUSTOM_URL="${{ github.event.inputs.target_url }}"
        # 2. Check if triggered by external deployment webhook
        elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          if [ "${{ github.event.action }}" = "deploy_prod" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="stage"
          fi
          CUSTOM_URL="${{ github.event.client_payload.url }}"
        # 3. Automatic branch triggers: main/master -> prod, otherwise -> stage
        elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
          TARGET_ENV="prod"
          CUSTOM_URL=""
        else
          TARGET_ENV="stage"
          CUSTOM_URL=""
        fi

        echo "Selected Environment: $TARGET_ENV"
        echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
        echo "custom_url=$CUSTOM_URL" >> $GITHUB_OUTPUT

    - name: Run Deployment Sanity Suite via Maven
      env:
        STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
        STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
        PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
        PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
      run: |
        TARGET_ENV="${{ steps.env_config.outputs.target_env }}"
        CMD="mvn test -DsuiteXmlFile=src/test/resources/deployment-sanity.xml -Denv=$TARGET_ENV -Dheadless=true -Dmaven.test.failure.ignore=true"

        # Dynamically inject credentials based on selected environment if defined in GitHub Secrets
        if [ "$TARGET_ENV" = "prod" ]; then
          if [ -n "$PROD_USERNAME" ]; then CMD="$CMD -Dusername=\"$PROD_USERNAME\""; fi
          if [ -n "$PROD_PASSWORD" ]; then CMD="$CMD -Dpassword=\"$PROD_PASSWORD\""; fi
        else
          if [ -n "$STAGE_USERNAME" ]; then CMD="$CMD -Dusername=\"$STAGE_USERNAME\""; fi
          if [ -n "$STAGE_PASSWORD" ]; then CMD="$CMD -Dpassword=\"$STAGE_PASSWORD\""; fi
        fi

        if [ -n "${{ steps.env_config.outputs.custom_url }}" ]; then
          CMD="$CMD -Durl=${{ steps.env_config.outputs.custom_url }}"
        fi

        echo "Executing Deployment Sanity Suite against environment: $TARGET_ENV"
        eval $CMD

    - name: Archive ExtentReports Dashboard & Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ExtentReports-${{ steps.env_config.outputs.target_env }}-Artifact
        path: |
          reports/
          test-output/
          target/surefire-reports/
        retention-days: 14
